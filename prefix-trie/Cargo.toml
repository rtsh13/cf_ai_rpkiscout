[package]
name    = "prefix-trie"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.1"

console_error_panic_hook = "0.1"

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level     = "s"
lto           = true
strip         = true
codegen-units = 1
